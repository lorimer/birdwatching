[platformio]
src_dir = .

[env:xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_ENABLED=1

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; LilyGO T-Display-S3 (touch or non-touch): ESP32-S3R8, 16 MB flash,
; ST7789 170x320 on an 8-bit parallel bus, CST816 capacitive touch,
; two buttons (GPIO0 / GPIO14), battery sense on GPIO4. No buzzer or LED;
; detections are shown on the display. An external piezo can be wired to
; a header pin by adding -DTDS3_BUZZER_PIN=<gpio> below.
[env:lilygo_t_display_s3]
platform = espressif32@^6.3.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DBOARD_LILYGO_T_DISPLAY_S3

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    lovyan03/LovyanGFX@1.2.7

build_src_filter = +<main.cpp> +<display_tdisplay_s3.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
